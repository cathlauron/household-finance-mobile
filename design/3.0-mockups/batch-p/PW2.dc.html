<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PW2 Password tips with ticks</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.ff{font-family:ui-rounded,"SF Pro Rounded",Nunito,-apple-system,system-ui,sans-serif}
.in{font:inherit;font-size:17px;border:0;background:transparent;color:#111111;flex:1;min-height:44px;outline:none}
.box:focus-within{box-shadow:0 0 0 2px #2E6B47}
</style>
</helmet>
<div class="ff" style="width: 390px; height: 844px; background: #F2F2F7; color: #111111; box-sizing: border-box; padding: 70px 24px 24px; overflow: hidden">
  <h1 style="margin: 0; font-size: 28px; font-weight: 700">Create your account</h1>
  <p style="margin: 6px 0 22px; font-size: 15px; color: #6C6C70">Your password also locks your money data.</p>
  <label for="pw2" style="font-size: 13px; color: #6C6C70; margin-left: 4px">Password</label>
  <div class="box" style="margin: 6px 0 14px; border-radius: 12px; background: #FFFFFF; padding: 0 8px 0 14px; display: flex; align-items: center; gap: 8px">
    <input id="pw2" class="in" type="text" value="{{pw}}" onChange="{{onPw}}" placeholder="Type a password to try it" autocomplete="new-password">
    <svg width="34" height="34" viewBox="0 0 36 36" role="img" aria-label="{{ringLabel}}"><circle cx="18" cy="18" r="14" fill="none" stroke="#E5E5EA" stroke-width="4"></circle><circle cx="18" cy="18" r="14" fill="none" stroke="{{ringColor}}" stroke-width="4" stroke-linecap="round" stroke-dasharray="88" stroke-dashoffset="{{ringOff}}" transform="rotate(-90 18 18)" style="transition: stroke-dashoffset 260ms ease-out, stroke 260ms"></circle></svg>
  </div>
  <div style="border-radius: 16px; background: #FFFFFF; overflow: hidden">
    <sc-for list="{{rules}}" as="r" hint-placeholder-count="4">
      <div style="{{r.row}}">
        <span style="{{r.dot}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="{{r.tick}}"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
        <span style="{{r.textStyle}}">{{r.text}}</span>
      </div>
    </sc-for>
  </div>
  <div role="status" style="margin: 12px 4px 0; font-size: 15px; font-weight: 700; color: {{wordColor}}">{{word}}</div>
  <button style="width: 100%; margin-top: 24px; min-height: 53px; border: 0; border-radius: 14px; background: #2E6B47; color: #FFFFFF; font: inherit; font-size: 17px; font-weight: 600; cursor: pointer">Create account</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var COMMON = ['password', '123456', 'qwerty', 'iloveyou', 'admin', 'welcome', 'letmein', 'abc123'];
var WORDS = ['', 'Weak', 'Okay', 'Good', 'Strong'];
var COLS = ['#6C6C70', '#D70015', '#B83200', '#4E8A66', '#2E6B47'];
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { pw: 'Mango2026' }; }
  renderVals() {
    var self = this, p = this.state.pw, low = p.toLowerCase();
    var checks = [
      ['At least 8 characters (12 is better)', p.length >= 8],
      ['A number', /\d/.test(p)],
      ['A symbol or a capital letter', /[^A-Za-z0-9]/.test(p) || /[A-Z]/.test(p)],
      ['Not a common password', p.length > 0 && !COMMON.some(function (c) { return low.indexOf(c) >= 0; })]
    ];
    var n = p ? checks.filter(function (c) { return c[1]; }).length : 0;
    if (p && p.length < 8) n = Math.min(n, 1);
    return {
      pw: p, onPw: function (e) { self.setState({ pw: e.target.value }); },
      rules: checks.map(function (c, i) {
        return {
          text: c[0],
          row: 'display:flex;align-items:center;gap:12px;min-height:48px;padding:0 16px' + (i ? ';border-top:1px solid #C6C6C8' : ''),
          dot: 'width:22px;height:22px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background 200ms,box-shadow 200ms;' + (c[1] ? 'background:#2E6B47' : 'background:transparent;box-shadow:inset 0 0 0 2px #C6C6C8'),
          tick: 'transition:transform 220ms cubic-bezier(.2,1.4,.4,1);transform:scale(' + (c[1] ? 1 : 0) + ')',
          textStyle: 'font-size:15px;color:' + (c[1] ? '#111111' : '#6C6C70')
        };
      }),
      ringColor: COLS[n], ringOff: String(88 - (88 * n) / 4), ringLabel: 'Strength: ' + (WORDS[n] || 'none yet'),
      word: p ? (WORDS[n] || 'Weak') : '', wordColor: COLS[n]
    };
  }
}
</script>
</body>
</html>

appId: host.exp.exponent
---
- openLink: "exp://192.168.1.62:8081"

# Unlock if app is on the lock screen
- runFlow:
    when:
      visible:
        id: "unlock-pin-input"
    commands:
      - tapOn:
          id: "unlock-pin-input"
      - inputText: "1234"
      - hideKeyboard
      - tapOn:
          id: "unlock-button"
      - extendedWaitUntil:
          visible:
            id: "home-tab"
          timeout: 15000

# 1. Ensure on Home tab
- tapOn:
    id: "home-tab"

# 2. Navigate to Settings via More tab, then tap Change PIN
- tapOn:
    id: "more-tab"
- extendedWaitUntil:
    visible:
      id: "more-settings-row"
    timeout: 15000
- tapOn:
    id: "more-settings-row"
- extendedWaitUntil:
    visible:
      id: "change-pin-button"
    timeout: 15000
- tapOn:
    id: "change-pin-button"

# 3. Wait for Set PIN screen
- extendedWaitUntil:
    visible:
      id: "pin-input"
    timeout: 15000

# 4. Fill PIN fields
- tapOn:
    id: "pin-input"
- inputText: "1234"

- tapOn:
    id: "confirm-pin-input"
- inputText: "1234"

- hideKeyboard

# 5. Save PIN
- tapOn:
    id: "save-pin-button"

# 6. Navigate to Profile via More tab > Settings > Profile Card, confirm Lock App button is visible
- tapOn:
    id: "more-tab"
- extendedWaitUntil:
    visible:
      id: "more-settings-row"
    timeout: 15000
- tapOn:
    id: "more-settings-row"
- extendedWaitUntil:
    visible:
      id: "profile-card"
    timeout: 15000
- tapOn:
    id: "profile-card"
- extendedWaitUntil:
    visible:
      id: "lock-app-button"
    timeout: 15000
- assertVisible:
    id: "lock-app-button"

# 7. Tap Lock App button to trigger lock immediately
- tapOn:
    id: "lock-app-button"

# 8. Confirm on Locked screen
- extendedWaitUntil:
    visible:
      id: "unlock-pin-input"
    timeout: 15000
- assertVisible:
    id: "unlock-pin-input"

# 9. Unlock with PIN
- tapOn:
    id: "unlock-pin-input"
- inputText: "1234"
- hideKeyboard

- tapOn:
    id: "unlock-button"

# 10. Confirm unlocked and back on Home
- extendedWaitUntil:
    visible:
      text: ".*signed in, testuser!.*"
    timeout: 15000
- assertVisible:
    text: ".*signed in, testuser!.*"
    optional: true
appId: host.exp.exponent
---
- openLink: "exp://192.168.1.62:8081"

# 1. Navigate to Settings
- tapOn:
    id: "settings-tab"

# 2. Fill Current Password
- scrollUntilVisible:
    element:
      id: "current-password-input"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "current-password-input"
- inputText: "test123456"
- hideKeyboard

# 3. Fill New Password
- scrollUntilVisible:
    element:
      id: "new-password-input"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "new-password-input"
- inputText: "newpass123"
- hideKeyboard

# 4. Fill Confirm New Password
- scrollUntilVisible:
    element:
      id: "confirm-new-password-input"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "confirm-new-password-input"
- inputText: "newpass123"
- hideKeyboard

# 5. Submit Change Password
- scrollUntilVisible:
    element:
      id: "change-password-button"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "change-password-button"

# 6. Wait for password change (dual PBKDF2 + Firestore)
- extendedWaitUntil:
    visible:
      text: "Password changed."
    timeout: 180000
- assertVisible:
    text: "Password changed."
    optional: true

# 7. Return to Home and sign out
- tapOn:
    id: "home-tab"
- tapOn:
    id: "sign-out-button"

# 8. Verify sign-in with NEW password (newpass123)
- extendedWaitUntil:
    visible:
      id: "sign-in-button"
    timeout: 15000
- tapOn:
    id: "email-input"
- inputText: "test@example.com"
- tapOn:
    id: "username-input"
- inputText: "testuser"
- tapOn:
    id: "password-input"
- inputText: "newpass123"
- hideKeyboard
- tapOn:
    id: "sign-in-button"

# 9. Confirm signed in with new password
- extendedWaitUntil:
    visible:
      text: ".*signed in.*"
    timeout: 120000
- assertVisible:
    text: ".*signed in.*"
    optional: true

# 10. Revert password back to test123456 (makes test idempotent)
- tapOn:
    id: "settings-tab"
- scrollUntilVisible:
    element:
      id: "current-password-input"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "current-password-input"
- inputText: "newpass123"
- hideKeyboard

- scrollUntilVisible:
    element:
      id: "new-password-input"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "new-password-input"
- inputText: "test123456"
- hideKeyboard

- scrollUntilVisible:
    element:
      id: "confirm-new-password-input"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "confirm-new-password-input"
- inputText: "test123456"
- hideKeyboard

- scrollUntilVisible:
    element:
      id: "change-password-button"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "change-password-button"

- extendedWaitUntil:
    visible:
      text: "Password changed."
    timeout: 180000
- assertVisible:
    text: "Password changed."
    optional: true

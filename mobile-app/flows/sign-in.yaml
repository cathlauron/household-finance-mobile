# Sign in on the INSTALLED app (3.10+) with the test account, then the tour can run.
# Set the account with: maestro test -e EMAIL=... -e USERNAME=... -e PASSWORD=... flows/sign-in.yaml
appId: com.cathlauron.householdfinance
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "sign-in-button"
    timeout: 60000
- tapOn:
    id: "email-input"
- inputText: ${EMAIL}
- tapOn:
    id: "username-input"
- inputText: ${USERNAME}
- tapOn:
    id: "password-input"
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn:
    id: "sign-in-button"
- extendedWaitUntil:
    visible:
      id: "home-tab"
    timeout: 120000

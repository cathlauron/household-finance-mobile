appId: host.exp.exponent
---
- openLink: "exp://192.168.1.62:8081"
- tapOn:
    id: "email-input"
- inputText: "test@example.com"
- tapOn:
    id: "username-input"
- inputText: "testuser"
- tapOn:
    id: "password-input"
- inputText: "test123456"
- tapOn:
    point: "50%,10%"
- tapOn:
    id: "sign-in-button"
- assertVisible:
    text: "signed in"
    optional: true

plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.ffkeysave'
version = '1.0.0'

android {
  namespace "expo.modules.ffkeysave"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // Android's Credential Manager: saves a password to the phone's password manager
  // (Google Password Manager, or another one the person chose). The second line lets it
  // work on phones before Android 14 too.
  implementation "androidx.credentials:credentials:1.3.0"
  implementation "androidx.credentials:credentials-play-services-auth:1.3.0"
}
